<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Streatham Fighter">
<title>Streatham Fighter</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0d1014}
body{color:#fff4dd;font:16px system-ui;display:grid;place-items:center;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
 overscroll-behavior:none;touch-action:manipulation}
/* Fit a 16:9 cabinet inside the viewport, leaving room for the keyboard hint on desktop */
main{padding:14px;width:min(1100px,100%,calc((100vh - 60px) * 16 / 9));
 width:min(1100px,100%,calc((100dvh - 60px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 16 / 9))}
.cabinet{position:relative;overflow:hidden;border:1px solid #46515a;background:#151e26;box-shadow:0 20px 100px #000a;aspect-ratio:16/9;container-type:inline-size}
canvas{width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;display:flex;align-items:center;padding:4% 5%;background:linear-gradient(90deg,#0d1015f5,#101319bc 52%,#0e182333)}
.screen[hidden]{display:none}
.stamp{color:#ffc247;letter-spacing:.2em;font-weight:800;font-size:clamp(9px,1.5cqw,15px)}
h1{font:italic 950 clamp(28px,8vw,108px)/.85 Impact,'Arial Black',sans-serif;font-size:clamp(26px,10.5cqw,108px);letter-spacing:-.045em;margin:.14em 0;text-transform:uppercase;text-shadow:4px 4px #8b3025}
h1 span{color:#ffae32}
p{margin:.75em 0;max-width:34ch;font-size:clamp(11px,1.75cqw,17px)}
#start{border:0;border-radius:3px;background:#ffc247;color:#191411;padding:.6em .9em;font:800 clamp(13px,1.8cqw,17px) system-ui;cursor:pointer;box-shadow:3px 3px #963828;min-height:40px}
#start:focus-visible{outline:3px solid white;outline-offset:3px}
.hint{text-align:center;color:#bac3cb;font-size:13px;margin-top:10px}

/* ---- Touch mode ---- */
body.touch main{padding:0;width:min(100%,calc((100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 16 / 9));
 width:min(100%,calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 16 / 9))}
body.touch .cabinet{border:0;box-shadow:none}
body.touch .hint{display:none}
#touch{position:fixed;inset:0;z-index:5;display:none;pointer-events:none}
body.touch.playing #touch{display:block}
#zone{position:absolute;left:0;top:0;bottom:0;width:50%;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:2px solid #fff4dd44;background:#11161e66;
 left:calc(env(safe-area-inset-left) + 96px);top:calc(100% - env(safe-area-inset-bottom) - 96px);opacity:.5;transition:opacity .2s;pointer-events:none}
#stick.on{opacity:1;transition:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#fff4dd55;border:2px solid #fff4dd99}
.act{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid #fff4dd66;background:#202832aa;color:#fff4dd;
 font:900 12px system-ui;letter-spacing:.08em;display:grid;place-items:center;padding:0}
.act::after{content:'';position:absolute;inset:-14px;border-radius:50%}
.act.on{transform:scale(.9);filter:brightness(1.35)}
#punch{width:86px;height:86px;right:calc(env(safe-area-inset-right) + 24px);bottom:calc(env(safe-area-inset-bottom) + 30px);background:#ffc247bb;color:#191411;border-color:#963828}
#dash{width:64px;height:64px;right:calc(env(safe-area-inset-right) + 124px);bottom:calc(env(safe-area-inset-bottom) + 96px)}
#turn{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 56.25vw + 18px);text-align:center;color:#8f99a3;font-size:13px;display:none}
@media (orientation:portrait){
 body.touch{place-items:start center}
 body.touch main{width:100%}
 #turn{display:block}
}
</style></head>
<body><main><div class="cabinet">
<canvas id="game" width="960" height="540" aria-label="Streatham Fighter arcade game"></canvas>
<div class="screen" id="screen"><div><div class="stamp" id="stamp">SOUTH LONDON · 08:28 AM</div><h1 id="title">Streatham<br><span>Fighter</span></h1><p id="message">Your kid’s nursery shuts its gates in 90 seconds. The high street has other ideas.</p><button id="start">Start the school run</button></div></div>
</div><div class="hint">Arrows / WASD to move · J to punch · K to dash · P to pause</div></main>
<div id="touch" aria-hidden="true">
 <div id="zone"><div id="stick"><div id="knob"></div></div></div>
 <div id="turn">Turn sideways for a bigger high street ↻</div>
 <button class="act" id="dash" data-key="k" tabindex="-1">DASH</button>
 <button class="act" id="punch" data-key="j" tabindex="-1">PUNCH</button>
</div>
<script>
'use strict';
const $=q=>document.querySelector(q), body=document.body;
const canvas=$('#game'), ctx=canvas.getContext('2d',{alpha:false});
const overlay=$('#screen'), start=$('#start');
const keys=new Set(), pad=new Set(), waves=[660,1450,2280], end=3025;
let mode='title', player, foes, sparks, next, time, camera, shake, notice, last=0, lastDraw=0, scale=1;
let stickX=0, stickY=0;
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
const isTouch=()=>body.classList.contains('touch');
const buzz=ms=>{if(isTouch()&&navigator.vibrate)navigator.vibrate(ms);};

function reset(){
 player={x:120,y:450,hp:100,face:1,attack:0,dash:0,dashWait:0,inv:0};
 foes=[];sparks=[];next=0;time=90;camera=0;shake=0;notice=0;
}

/* ---------- Modes & overlay ---------- */
function setMode(m){mode=m;body.classList.toggle('playing',m==='play');if(m!=='play')releaseTouch();}
function showScreen(stamp,title,message,button){
 $('#stamp').textContent=stamp;$('#title').innerHTML=title;$('#message').textContent=message;
 start.textContent=button;overlay.hidden=false;if(!isTouch())start.focus();
}
function startRun(){reset();setMode('play');overlay.hidden=true;start.blur();last=0;goFullscreen();}
function pause(){
 if(mode!=='play')return;setMode('paused');keys.clear();
 showScreen('PAUSED · '+Math.ceil(time)+'s ON THE CLOCK','Hold<br><span>Up</span>','The high street will wait. The nursery won’t.','Carry on');
}
function resume(){setMode('play');overlay.hidden=true;start.blur();last=0;}
function finish(win){
 setMode('over');
 showScreen(win?'08:29 AM · DROP-OFF COMPLETE':'SOUTH LONDON · RUN ENDED',
  win?'Nailed<br><span>Drop-off</span>':'Nursery<br><span>Closed</span>',
  win?'You made it. The little one wants to know if tomorrow can be a bus day.':time<=0?'The clock beat you. The gates are shut.':'You went down on the high street. Give the school run another go.',
  'Run it again');
 buzz(win?[30,60,30]:120);
}
start.onclick=()=>mode==='paused'?resume():startRun();
function goFullscreen(){
 // Android Chrome: go fullscreen and lock landscape. iPhone Safari has no element fullscreen; no-op there.
 if(!isTouch()||document.fullscreenElement||!document.documentElement.requestFullscreen)return;
 document.documentElement.requestFullscreen({navigationUI:'hide'})
  .then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape'))
  .catch(()=>{});
}
// Phones: backgrounding the app pauses. Desktop keeps the original behaviour (game just freezes while the tab is hidden).
document.addEventListener('visibilitychange',()=>{if(document.hidden&&isTouch())pause();});
addEventListener('blur',()=>{keys.clear();last=0;});

/* ---------- Keyboard ---------- */
const bindings=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d','w','s','j','k',' '];
addEventListener('keydown',e=>{
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 if((k==='p'||k==='Escape')&&!e.repeat){if(mode==='play')pause();else if(mode==='paused')resume();return;}
 if(!bindings.includes(k)||(k===' '&&e.target instanceof HTMLButtonElement))return;
 e.preventDefault();keys.add(k);
});
addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));

/* ---------- Touch: floating joystick + action buttons ---------- */
if(matchMedia('(pointer:coarse)').matches)body.classList.add('touch');
addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!isTouch()){body.classList.add('touch');fit();}},{capture:true,passive:true});
addEventListener('contextmenu',e=>{if(isTouch())e.preventDefault();});
const zone=$('#zone'), stick=$('#stick'), knob=$('#knob'), R=50;
let stickId=null, ox=0, oy=0;
function moveStick(e){
 let vx=e.clientX-ox, vy=e.clientY-oy;
 const len=Math.hypot(vx,vy);
 if(len>R){ // drag the base along with the thumb so direction changes stay instant
   const k=1-R/len;ox+=vx*k;oy+=vy*k;vx=e.clientX-ox;vy=e.clientY-oy;
   stick.style.left=ox+'px';stick.style.top=oy+'px';
 }
 knob.style.transform='translate('+vx+'px,'+vy+'px)';
 const l=Math.hypot(vx,vy);
 // 8-way: an axis is active when within ~67.5° of it (sin 22.5° ≈ .38)
 stickX=l<12?0:Math.abs(vx)/l>.38?Math.sign(vx):0;
 stickY=l<12?0:Math.abs(vy)/l>.38?Math.sign(vy):0;
}
function endStick(){
 stickId=null;stickX=stickY=0;knob.style.transform='';
 stick.classList.remove('on');stick.style.left=stick.style.top='';
}
zone.addEventListener('pointerdown',e=>{
 if(stickId!==null)return;e.preventDefault();
 stickId=e.pointerId;zone.setPointerCapture(e.pointerId);
 ox=e.clientX;oy=e.clientY;stick.style.left=ox+'px';stick.style.top=oy+'px';stick.classList.add('on');moveStick(e);
});
zone.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e);});
for(const t of ['pointerup','pointercancel','lostpointercapture'])zone.addEventListener(t,e=>{if(e.pointerId===stickId)endStick();});
document.querySelectorAll('.act').forEach(b=>{
 const k=b.dataset.key;
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);pad.add(k);b.classList.add('on');});
 const up=()=>{pad.delete(k);b.classList.remove('on');};
 for(const t of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(t,up);
});
function releaseTouch(){endStick();pad.clear();document.querySelectorAll('.act.on').forEach(b=>b.classList.remove('on'));}
const down=(...k)=>k.some(key=>keys.has(key)||pad.has(key));

/* ---------- Crisp rendering on high-DPI screens ---------- */
function fit(){
 const w=canvas.getBoundingClientRect().width||960;
 const s=clamp(Math.ceil(w*(devicePixelRatio||1)/960*4)/4,1,2);
 if(s===scale)return;
 scale=s;canvas.width=960*s;canvas.height=540*s;
}
new ResizeObserver(fit).observe(canvas);
addEventListener('orientationchange',()=>setTimeout(fit,250));

/* ---------- Game ---------- */
function burst(x,y,color){
 for(let i=0;i<10;i++)sparks.push({x,y,vx:(Math.random()-.5)*380,vy:-Math.random()*240,life:.3+Math.random()*.2,color});
}
function update(dt){
 time-=dt;
 for(const k of ['attack','dash','dashWait','inv'])player[k]=Math.max(0,player[k]-dt);
 shake=Math.max(0,shake-dt);notice=Math.max(0,notice-dt);
 const dx=clamp(Number(down('ArrowRight','d'))-Number(down('ArrowLeft','a'))+stickX,-1,1);
 const dy=clamp(Number(down('ArrowDown','s'))-Number(down('ArrowUp','w'))+stickY,-1,1);
 if(dx&&!player.dash)player.face=dx;
 if(down('k')&&!player.dashWait){player.dash=.17;player.dashWait=.65;player.inv=Math.max(player.inv,.2);}
 const speed=dx&&dy?157:222;
 const gate=foes.length?waves[next-1]+170:next<waves.length?waves[next]+10:end+20;
 player.x=clamp(player.x+(player.dash?player.face*585:dx*speed)*dt,40,gate);
 player.y=clamp(player.y+dy*speed*dt,365,503);
 if(!foes.length&&next<waves.length&&player.x>=waves[next]){
   for(let i=0;i<next+2;i++){
     const direction=i%2===0?1:-1;
     foes.push({x:player.x+direction*(105+i*14),y:clamp(player.y-52+i*36,370,502),hp:2+(next===2&&i===0?1:0),wind:0,wait:.4+i*.22,stun:0,face:-direction});
   }
   next++;notice=1.2;buzz(25);
 }
 if(down('j',' ')&&!player.attack){
   player.attack=.28;let landed=false;
   for(const foe of foes){
     const distance=(foe.x-player.x)*player.face;
     if(distance>=-14&&distance<103&&Math.abs(foe.y-player.y)<42){
       foe.hp--;foe.x+=player.face*38;foe.stun=.24;foe.wind=0;foe.wait=.43;landed=true;
       burst(foe.x,foe.y-37,'#ffc040');shake=.14;
     }
   }
   if(landed)buzz(12);
   foes=foes.filter(foe=>foe.hp>0);
 }
 for(const foe of foes){
   foe.face=foe.x<player.x?1:-1;
   foe.stun=Math.max(0,foe.stun-dt);
   if(foe.stun)continue;
   const x=player.x-foe.x,y=player.y-foe.y;
   if(foe.wind>0){
     foe.wind-=dt;
     if(foe.wind<=0){
       foe.wait=.9;
       if(Math.abs(x)<58&&Math.abs(y)<32&&!player.inv){
         player.hp-=12;player.inv=.55;shake=.2;burst(player.x,player.y-38,'#ff5741');buzz(45);
       }
     }
   }else{
     foe.wait-=dt;
     if(Math.abs(x)<41&&Math.abs(y)<24){
       if(foe.wait<=0)foe.wind=.34;
     }else{
       if(Math.abs(x)>38)foe.x+=Math.sign(x)*(72+next*12)*dt;
       if(Math.abs(y)>18)foe.y+=Math.sign(y)*72*dt;
     }
   }
 }
 for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=620*dt;p.life-=dt;}
 sparks=sparks.filter(p=>p.life>0);
 camera+=(clamp(player.x-285,0,end-637)-camera)*Math.min(1,8*dt);
 if(player.hp<=0||time<=0)finish(false);
 else if(next===waves.length&&!foes.length&&player.x>=end)finish(true);
}

/* ---------- Rendering ---------- */
let font='';
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);}
function label(t,x,y,size,color='#fff4de',align='left'){
 const f='900 '+size+'px system-ui';if(f!==font){ctx.font=font=f;}
 ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(t,x,y);
}
const signs=['STREATHAM','OFF LICENCE','CHICKEN & CHIPS','BARBERS','NIGHT BUS','CASH & CARRY','LAUNDERETTE','THE HIGH ROAD'];
let sky;
function street(now){
 sky=sky||(()=>{const g=ctx.createLinearGradient(0,0,0,360);g.addColorStop(0,'#182836');g.addColorStop(1,'#b66f5c');return g;})();
 rect(0,0,960,360,sky);
 for(let i=0;i<20;i++){const x=i*109-camera*.34;if(x<-100||x>960)continue;const h=82+(i*31)%114;rect(x,300-h,95,h,'#333541');for(let j=0;j<3;j++)rect(x+13+j*24,307-h,11,19,'#66606a');}
 for(let i=0;i<15;i++){
   const x=i*231-camera,h=109+(i*37)%68,y=284-h;
   if(x<-240||x>960)continue;
   rect(x,y,226,h+52,['#513937','#473e42','#604441'][i%3]);rect(x-3,y,232,9,'#292830');
   for(let row=y+15;row<265;row+=12)rect(x,row,225,1,'#221f245c');
   for(let j=0;j<3;j++){rect(x+21+j*71,y+24,39,47,'#252a32');rect(x+27+j*71,y+29,27,36,j%2?'#807260':'#3b4653');rect(x+39+j*71,y+29,2,36,'#22262b');}
   rect(x+6,254,214,25,i===13?'#315d4e':'#272933');label(i===13?'LITTLE ACORNS NURSERY':signs[i%signs.length],x+113,272,14,i%2?'#fac579':'#dbd0be','center');
   rect(x+10,281,204,56,'#222830');for(let j=0;j<3;j++){rect(x+18+j*65,286,55,43,i===13?'#a77a49':'#3c4148');rect(x+18+j*65,307,55,3,'#282d34');}
 }
 rect(0,336,960,204,'#292e37');rect(0,336,960,28,'#53545a');rect(0,360,960,5,'#878086');rect(0,365,960,4,'#181e27');
 for(let i=0;i<30;i++){const x=i*139-camera;if(x<-88||x>960)continue;rect(x,475,73,4,'#8b784c');rect(x+32,405+i%4*11,56,2,'#3e4650');}
 const bus=1150-camera;
 if(bus>-170&&bus<960){rect(bus,285,165,83,'#a83938');rect(bus+6,291,151,20,'#252e35');rect(bus+6,320,151,20,'#252e35');label('159',bus+10,335,14,'#ffd38d');}
 // rain: one batched path instead of 39 separate strokes
 ctx.strokeStyle='#c5d8ed32';ctx.lineWidth=1;ctx.beginPath();
 const a=Math.floor(now/20),b=Math.floor(now/9);
 for(let i=0;i<39;i++){const x=((i*191+a*(i%3+1))%1000)-20;const y=(i*97+b*(i%4+2))%540;ctx.moveTo(x,y);ctx.lineTo(x-6,y+17);}
 ctx.stroke();
}
function actor(x,y,f,coat,skin,pose,flash=false){
 ctx.save();ctx.translate(x-camera,y);
 ctx.fillStyle='#13171c99';ctx.beginPath();ctx.ellipse(0,0,25,7,0,0,7);ctx.fill();
 ctx.scale(f,1);
 rect(-16,-24,13,21,'#161c25');rect(4,-23,12,20,'#232833');rect(-18,-6,17,5,'#11151b');rect(4,-6,17,5,'#11151b');
 rect(-18,-52,35,30,flash?'#fff3d3':coat);rect(-16,-50,7,25,'#191e2966');
 rect(-10,-70,22,20,skin);rect(-12,-73,24,9,'#171b21');rect(5,-63,5,3,'#352626');
 if(pose){rect(10,-49,27,10,coat);rect(34,-49,10,10,skin);}
 else{rect(13,-48,9,22,coat);rect(14,-32,8,7,skin);}
 ctx.restore();
}
function draw(now){
 ctx.setTransform(scale,0,0,scale,0,0);
 ctx.save();
 if(shake>0)ctx.translate(Math.random()*8-4,Math.random()*6-3);
 street(now);
 const kid={x:player.x-53,y:player.y+12,kid:true};
 const figures=[...foes,player,kid].sort((a,b)=>a.y-b.y);
 for(const f of figures){
   if(f.kid){ctx.save();ctx.translate(f.x-camera,f.y);ctx.scale(.57,.57);actor(camera,0,1,'#6852a1','#d4a77d',false);ctx.restore();}
   else if(f===player)actor(f.x,f.y,f.face,'#d98b31','#e2ad86',f.attack>.13,f.inv>0&&Math.floor(f.inv*25)%2===0);
   else{
     actor(f.x,f.y,f.face,f.wind>0?'#bf524e':'#437870','#bc8e78',f.wind>0,f.stun>.15);
     rect(f.x-camera-13,f.y-81,26,3,'#222');rect(f.x-camera-13,f.y-81,Math.min(f.hp/2,1)*26,3,'#e36d53');
   }
 }
 for(const p of sparks)rect(p.x-camera,p.y,5,4,p.color);
 ctx.restore();
 if(mode==='title')return;
 rect(17,17,250,60,'#11161ee8');label('PARENT',29,40,17);rect(29,49,222,12,'#4b3235');rect(29,49,222*Math.max(0,player.hp)/100,12,'#ffb343');
 rect(420,17,120,60,'#11161ee8');label(String(Math.max(0,Math.ceil(time))).padStart(2,'0'),480,58,39,time<20?'#ff6851':'#fff4de','center');
 rect(703,17,240,60,'#11161ee8');label('LITTLE ACORNS',928,40,17,'#fff4de','right');rect(718,50,210,10,'#3d454b');rect(718,50,210*player.x/end,10,'#90c39e');
 if(foes.length){
   const text=notice>0?'HIGH STREET AMBUSH':'CLEAR THE PAVEMENT';label(text,480,114,24,'#ffc247','center');
 }else label(next===3?'NURSERY GATES AHEAD':'KEEP MOVING RIGHT',480,114,21,'#fff4de','center');
}
function loop(now){
 requestAnimationFrame(loop);
 // Behind menus the scene is only ambience: draw at ~30fps to save battery.
 if(mode!=='play'&&now-lastDraw<32)return;
 const dt=last?Math.min((now-last)/1000,.05):0;
 last=now;lastDraw=now;
 if(mode==='play'&&!document.hidden)update(dt);
 draw(now);
}
reset();fit();requestAnimationFrame(loop);
</script>
</body></html>
